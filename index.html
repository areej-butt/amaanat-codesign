<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Amaanat: which one feels right?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6E9E4; --surface:#F4F5F1; --ink:#18211E; --muted:#5E6A65; --line:#CDD3CD;
  --green:#1E5B4F; --green-soft:#D7E6E0; --gold:#B8872B; --gold-soft:#F3E7CC;
  --chosen:#1E5B4F; --focus:#B8872B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121715; --surface:#1A201D; --ink:#E9EDEA; --muted:#9AA6A0; --line:#2C3531;
    --green:#7FC2AE; --green-soft:#1F332D; --gold:#E0B566; --gold-soft:#33291A; --chosen:#7FC2AE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1A201D; --ink:#E9EDEA; --muted:#9AA6A0; --line:#2C3531;
  --green:#7FC2AE; --green-soft:#1F332D; --gold:#E0B566; --gold-soft:#33291A; --chosen:#7FC2AE;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Onest,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.ur{font-family:"Noto Nastaliq Urdu",serif;direction:rtl;line-height:2.1}

/* ---------- shell ---------- */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px clamp(16px,3vw,32px);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.mark{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-.01em}
.mark .seal{width:30px;height:30px;border-radius:9px;background:var(--green);display:grid;place-items:center;color:var(--bg)}
.mark small{font-weight:500;color:var(--muted);font-size:14px}
.top .grow{flex:1}
.who{font-size:14px;color:var(--muted);padding:6px 12px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.tbtn{background:transparent;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px}
.tbtn:hover{border-color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:clamp(20px,3vw,36px) clamp(16px,3vw,32px) 60px}

/* start */
.start{max-width:560px;margin:4vh auto 0}
.start h1{font-size:clamp(30px,4vw,42px);line-height:1.1;letter-spacing:-.02em;margin:0 0 8px}
.start p{color:var(--muted);margin:0 0 28px}
.field{margin-bottom:22px}
.field label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.field input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 15px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--bg)}
.go{background:var(--green);color:var(--bg);border:0;border-radius:14px;padding:15px 22px;font-weight:600;font-size:16px;width:100%}
.go:disabled{opacity:.4;cursor:not-allowed}
.resume{margin-top:34px;border-top:1px solid var(--line);padding-top:18px}
.resume h2{font-size:15px;color:var(--muted);font-weight:500;margin:0 0 10px}
.resume button{display:flex;justify-content:space-between;width:100%;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 2px;text-align:left}
.resume button span:last-child{color:var(--muted);font-size:14px}

/* question */
.qmeta{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:14px;margin-bottom:14px}
.qmeta .bar{flex:1;height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.qmeta .bar i{display:block;height:100%;background:var(--green);transition:width .3s}
.qmeta .star{color:var(--gold);font-weight:600}
.qhead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 28px;margin-bottom:clamp(20px,3vw,34px)}
.qhead h1{font-size:clamp(26px,3.4vw,40px);line-height:1.12;letter-spacing:-.022em;margin:0;max-width:22ch;font-weight:650}
.qhead .ur{font-size:clamp(18px,2vw,23px);color:var(--muted);margin:0}
.opts{display:flex;gap:clamp(16px,3vw,40px);justify-content:center;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 6px 14px;margin:0 -6px}
.opt{flex:0 0 auto;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;background:transparent;border:0;padding:14px 14px 16px;border-radius:30px;transition:background .2s}
.opt .lab{display:flex;align-items:center;min-height:50px;gap:10px;font-weight:600;font-size:17px;max-width:270px;text-align:left}
.opt .letter{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt .pick{font-size:14px;color:var(--muted);height:20px}
.opt:hover{background:color-mix(in srgb,var(--surface) 70%,transparent)}
.opt.on{background:var(--green-soft)}
.opt.on .letter{background:var(--chosen);border-color:var(--chosen);color:var(--bg)}
.opt.on .pick{color:var(--chosen);font-weight:600}
.opt.on .ph{box-shadow:0 0 0 4px var(--chosen),0 18px 40px -18px rgba(0,0,0,.45)}
.navrow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px;flex-wrap:wrap}
.navrow .mid{display:flex;gap:8px}
.nbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 18px;font-size:15px}
.nbtn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.nbtn[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.keys{font-size:13px;color:var(--muted);text-align:center;margin-top:16px}
.saved{font-size:13px;color:var(--muted)}

/* results */
.res h1{font-size:clamp(26px,3vw,36px);margin:0 0 6px;letter-spacing:-.02em}
.res p{color:var(--muted);margin:0 0 20px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-weight:600;white-space:nowrap}
td.q{min-width:240px}
td.q small{display:block;color:var(--muted)}
.cell{display:inline-grid;place-items:center;min-width:28px;height:28px;border-radius:8px;font-weight:700;font-size:13px}
.cA{background:var(--green);color:var(--bg)} .cB{background:var(--gold);color:#1a1405} .cC{background:#6F7E9A;color:#fff} .cN{background:var(--line);color:var(--muted)}
.tally{color:var(--muted);white-space:nowrap}
.empty{padding:28px;text-align:center;color:var(--muted)}

/* ---------- prototype (fixed app palette) ---------- */
.ph{--p:#1E5B4F;--ps:#E1ECE7;--pi:#18211E;--pm:#68736E;--pl:#E2E6E1;--pg:#9C6F1C;--pgs:#F6EBD2;--pr:#9E3A35;--prs:#F7E4E1;
  width:262px;height:548px;border-radius:40px;background:#161C1A;padding:9px;flex:0 0 auto;box-shadow:0 18px 40px -18px rgba(0,0,0,.45);transition:box-shadow .2s;color-scheme:light}
.scr{position:relative;height:100%;border-radius:32px;overflow:hidden;background:#F5F6F2;color:var(--pi);font:12px/1.4 Onest,system-ui,sans-serif;display:flex;flex-direction:column;text-align:left}
.scr::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:74px;height:20px;background:#161C1A;border-radius:12px;z-index:3}
.sb{display:flex;justify-content:space-between;align-items:center;padding:10px 22px 4px;font-weight:600;font-size:11.5px;height:34px;flex:0 0 auto}
.sb .dots{display:flex;gap:3px;align-items:flex-end}
.sb .dots i{width:3px;background:currentColor;border-radius:1px}
.sb .bat{width:20px;height:10px;border:1.4px solid currentColor;border-radius:3px;margin-left:5px;position:relative}
.sb .bat::after{content:"";position:absolute;inset:1.4px 5px 1.4px 1.4px;background:currentColor;border-radius:1px}
.hi{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:92px;height:4px;border-radius:3px;background:#161C1A;opacity:.85}
.ab{display:flex;align-items:center;gap:6px;padding:8px 14px 10px;flex:0 0 auto}
.ab .bk{color:var(--p);display:flex}
.ab .abt{font-size:16px;font-weight:650;letter-spacing:-.01em;flex:1}
.bd{flex:1;display:flex;flex-direction:column;gap:8px;padding:0 14px 22px;overflow:hidden}
.sp{flex:1}
.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.i.sm{width:13px;height:13px}.i.lg{width:22px;height:22px}
.cd{background:#fff;border:1px solid var(--pl);border-radius:14px;padding:10px 11px}
.cd.dash{border:1.5px dashed #B9C2BC;background:transparent;text-align:center;padding:14px 10px}
.cd.red{border-color:#E7C3BE;background:var(--prs)}
.rw{display:flex;align-items:center;gap:9px}
.rw+.rw{margin-top:9px;padding-top:9px;border-top:1px solid var(--pl)}
.ic{width:30px;height:30px;border-radius:10px;background:var(--ps);color:var(--p);display:grid;place-items:center;flex:0 0 auto}
.ic.gold{background:var(--pgs);color:var(--pg)}.ic.red{background:#F1D6D2;color:var(--pr)}.ic.grey{background:#ECEEEA;color:var(--pm)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:650;font-size:12px;color:#fff;flex:0 0 auto}
.av.lg{width:46px;height:46px;font-size:17px}
.a1{background:#1E5B4F}.a2{background:#9C6F1C}.a3{background:#5B6B8C}.a4{background:#8A5A6E}
.tx{flex:1;min-width:0}
.t{font-weight:600;font-size:12.5px}
.s{font-size:10.5px;color:var(--pm)}
.big{font-size:17px;line-height:1.28;font-weight:600;letter-spacing:-.01em}
.mut{font-size:10.5px;color:var(--pm)}.c{text-align:center}
.lbl{font-size:10.5px;color:var(--pm);font-weight:500;margin-top:4px}
.bn{display:flex;gap:8px;align-items:flex-start;border-radius:12px;padding:9px 10px;font-size:11px;background:#ECEEEA;color:#3E4844}
.bn.gold{background:var(--pgs);color:#6B4D12}.bn.green{background:var(--ps);color:#1A4C42}
.btn{height:38px;border-radius:12px;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12.5px;flex:0 0 auto}
.btn.ghost{background:transparent;color:var(--p);border:1.5px solid #BFD3CB}
.btn.off{background:#D9DDD8;color:#8C9590}
.btn.sm{height:26px;font-size:11px;padding:0 10px;border-radius:9px;display:inline-grid}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--ps);color:var(--p);white-space:nowrap}
.tag.gold{background:var(--pgs);color:var(--pg)}.tag.dark{background:#28312D;color:#fff}.tag.grey{background:#ECEEEA;color:var(--pm)}.tag.red{background:#F1D6D2;color:var(--pr)}
.tg{width:30px;height:18px;border-radius:9px;background:var(--p);position:relative;flex:0 0 auto}
.tg::after{content:"";position:absolute;top:2px;right:2px;width:14px;height:14px;border-radius:50%;background:#fff}
.tg.off{background:#CCD2CD}.tg.off::after{right:auto;left:2px}
.tg.lk{opacity:.55}
.fld{background:#fff;border:1px solid var(--pl);border-radius:11px;padding:7px 10px}
.fld .s{margin-bottom:2px}
.fld .v{font-size:12.5px;display:flex;justify-content:space-between;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;margin:6px auto;display:grid;place-items:center;background:conic-gradient(var(--pg) 0 86%,#EADFC6 0)}
.ring>div{width:80px;height:80px;border-radius:50%;background:#F5F6F2;display:grid;place-items:center;text-align:center;line-height:1.05}
.ring b{font-size:28px;display:block}.ring span{font-size:10px;color:var(--pm)}
.track{display:flex;gap:4px;align-items:center;margin:4px 0}
.track i{flex:1;height:8px;border-radius:4px;background:#DFE4DF}
.track i.f{background:var(--p)}
.steps{display:flex;flex-direction:column;gap:0}
.st{display:flex;gap:9px;padding-bottom:12px;position:relative}
.st::before{content:"";position:absolute;left:6px;top:15px;bottom:0;width:2px;background:#D9DED9}
.st:last-child::before{display:none}
.st .d{width:14px;height:14px;border-radius:50%;border:2px solid #B9C2BC;background:#F5F6F2;flex:0 0 auto;margin-top:1px;position:relative;z-index:1}
.st .d.f{background:var(--p);border-color:var(--p)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keypad i{height:30px;border-radius:10px;background:#fff;border:1px solid var(--pl);display:grid;place-items:center;font-style:normal;font-weight:600;font-size:13px}
.pin{display:flex;gap:9px;justify-content:center;margin:4px 0}
.pin i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--pi)}
.pin i.f{background:var(--pi)}
.prog{height:4px;border-radius:3px;background:#DFE4DF;overflow:hidden}.prog i{display:block;height:100%;background:var(--p)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.grid i{aspect-ratio:1;border-radius:6px;position:relative}
.cb{width:15px;height:15px;border-radius:5px;border:1.6px solid #AFB8B2;flex:0 0 auto;display:grid;place-items:center}
.cb.f{background:var(--p);border-color:var(--p);color:#fff}
.grp{font-size:11px;font-weight:650;display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.dim{opacity:.5}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:14px 14px 24px;box-shadow:0 -10px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;gap:8px;z-index:2}
.grab{width:34px;height:4px;border-radius:3px;background:#D3D8D3;margin:0 auto 4px}
.veil{position:absolute;inset:0;background:rgba(20,26,24,.42);z-index:1}
.ok{color:var(--p)}.no{color:var(--pr)}
/* chat */
.wa .sb{background:#1F3A33;color:#fff}
.wah{background:#1F3A33;color:#fff;display:flex;align-items:center;gap:8px;padding:4px 12px 10px}
.wab{flex:1;background:#E9E4DA;padding:12px 10px;display:flex;flex-direction:column;gap:7px}
.bub{max-width:84%;background:#fff;border-radius:10px;padding:7px 9px;font-size:11.5px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.bub.me{align-self:flex-end;background:#D9F0D6}
.bub small{display:block;text-align:right;font-size:9px;color:#7A857F;margin-top:2px}
.bub .who{font-size:10px;font-weight:650;color:#8A5A6E;margin-bottom:1px;border:0;padding:0}
.bub.blur{color:transparent;text-shadow:0 0 7px rgba(0,0,0,.45);position:relative}
.bub.blur .hide{position:absolute;inset:0;display:grid;place-items:center;color:#5E6A65;text-shadow:none;font-size:10px;font-weight:600}
.lp{background:#F1F3EF;border-radius:8px;padding:7px;margin-top:5px;display:flex;gap:7px;align-items:center}
.wai{background:#E9E4DA;padding:6px 8px 22px;display:flex;gap:6px}
.wai div{flex:1;height:28px;border-radius:14px;background:#fff}
/* lock & home */
.lock{background:linear-gradient(160deg,#2B4A42,#1A2622 60%,#3D3423);color:#fff}
.lock .time{font-size:56px;font-weight:300;text-align:center;letter-spacing:-.03em;line-height:1;margin-top:20px}
.lock .date{text-align:center;font-size:12px;opacity:.85;margin-top:4px}
.ntf{margin:22px 10px 0;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:16px;padding:10px 11px;display:flex;gap:9px}
.home{background:linear-gradient(170deg,#C9D8D0,#E9DFC9);}
.apps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;padding:22px 14px}
.app{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;color:#1F2A26;text-align:center}
.app i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:#fff;font-style:normal}
.app.target i{box-shadow:0 0 0 3px #fff,0 0 0 5px rgba(30,91,79,.55)}
.dock{position:absolute;left:10px;right:10px;bottom:20px;height:62px;border-radius:20px;background:rgba(255,255,255,.4);display:flex;justify-content:space-around;align-items:center}
.dock i{width:40px;height:40px;border-radius:11px;display:block}
.hero{height:190px;flex:0 0 auto;position:relative;overflow:hidden}
@media (max-width:720px){
  .opts{justify-content:flex-start}
  .qhead h1{max-width:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="mark"><span class="seal"><svg class="i" viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>Amaanat</div>

</header>
<main id="app"></main>

<script>
/* Paste your Google Apps Script web app URL here */
const ENDPOINT='https://script.google.com/macros/s/AKfycbzHxDijY6IjOCBL6bgqpOrze2lYNkrg1bxlMcfkQ88t1Qwk7_MmcQKfkE60N1pNbze8/exec';

/* ================= icons ================= */

 lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',

 x:'<path d="M6 6l12 12M18 6L6 18"/>',

 pause:'<path d="M9 5v14M15 5v14"/>',

  else{track=`<div class="track"><i class="f" style="flex:1"></i><i style="flex:29"></i></div><div class="mut" style="display:flex;justify-content:space-between"><span>Today</span><span>Day 15</span><span>Day 30</span></div>`}

    `<div class="big" style="margin-top:6px">Ammi’s plan opens in <span style="color:var(--p)">${n} days</span></div>
     <div class="mut">if she doesn’t reply.</div>${cd(track)}

}

function catGrid(own){
  const base=[['bank','Bank'],['wallet','Wallets'],['users','Social media'],['msg','Email'],['phone','Phone & SIM'],['doc','Documents'],['lock','Keys & lockers']];

  let h=base.map(c=>cell(c)).join('');
  if(own)h+=cell(['heart','Committee money'],'gold')+cell(['note','Prize bonds'],'gold')+`<div class="cd dash" style="padding:9px;display:grid;place-items:center;gap:4px">${I('plus')}<div class="t" style="font-size:11px">Add your own</div></div>`;
  return `<div class="s">${own?'Add anything that matters to you':'Choose what to include'}</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${h}</div>`;
}

const DROP=new Set(['starter','hospital','veto','asktone','suggest','seeall','rehearse','tone','womensteward','grieftone','opener','together','name']);
Q.splice(0,Q.length,...Q.filter(q=>!DROP.has(q.id)));

/* ================= state ================= */
const BK='amaanat-codesign-backup';
let view='start';
let S={id:'',name:'',age:'',picks:{},idx:0,status:''};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const app=document.getElementById('app');
function backup(){try{localStorage.setItem(BK,JSON.stringify(S))}catch(e){}}
try{const b=JSON.parse(localStorage.getItem(BK)||'null');if(b&&b.id&&b.status!=='sent'){S=b;view=b.status?'done':'q'}}catch(e){}

function render(){
  const who=document.getElementById('who');
  who.hidden=view==='start';who.textContent=S.name;
  if(view==='start')renderStart();else if(view==='q')renderQ();else renderDone();
}
function renderStart(){
  app.innerHTML=`<section class="start">
   <h1>Which one feels right?</h1>
   <p>You’ll see ${Q.length} short questions. Each shows two or three versions of an app screen. Tap the one you prefer. There are no right answers.</p>
   <div class="field"><label for="nm">Name</label><input id="nm" autocomplete="off" value="${esc(S.name)}"></div>
   <div class="field"><label for="ag">Age</label><input id="ag" type="number" inputmode="numeric" min="1" max="120" value="${esc(S.age)}"></div>
   <button class="go" id="go">Start</button></section>`;
  const nm=app.querySelector('#nm'),ag=app.querySelector('#ag'),go=app.querySelector('#go');
  const upd=()=>{go.disabled=!(nm.value.trim()&&ag.value.trim())};
  nm.oninput=ag.oninput=upd;upd();
  go.onclick=()=>{S={id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),name:nm.value.trim(),age:ag.value.trim(),picks:{},idx:0,status:''};backup();view='q';render()};
}
function renderQ(){
  const q=Q[S.idx],pick=S.picks[q.id],last=S.idx===Q.length-1;
  app.innerHTML=`<div class="qmeta"><span>${SECTIONS[q.sec]}</span><span class="bar"><i style="width:${(S.idx+1)/Q.length*100}%"></i></span><span>${S.idx+1} of ${Q.length}</span></div>
   <div class="qhead"><h1>${q.title}</h1></div>
   <div class="opts" role="radiogroup" aria-label="${esc(q.title)}">${q.opts.map(o=>`<div class="opt ${pick===o.k?'on':''}" role="radio" tabindex="0" aria-checked="${pick===o.k}" data-k="${o.k}">
      <div class="lab"><span class="letter">${o.k}</span>${o.label}</div>${o.scr()}<div class="pick">${pick===o.k?'Chosen':'Tap to choose'}</div></div>`).join('')}</div>
   <div class="navrow"><button class="nbtn" id="prev" ${S.idx===0?'disabled':''}>Back</button>
     <div class="mid"><button class="nbtn" id="unsure" aria-pressed="${pick==='?'}">Not sure</button></div>
     <button class="nbtn primary" id="next" ${pick?'':'disabled'}>${last?'Send my answers':'Next'}</button></div>`;
  app.querySelectorAll('.opt').forEach(el=>{el.onclick=()=>choose(el.dataset.k);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose(el.dataset.k)}}});
  app.querySelector('#prev').onclick=()=>move(-1);
  app.querySelector('#next').onclick=()=>move(1);
  app.querySelector('#unsure').onclick=()=>choose('?');
}
function choose(k){const q=Q[S.idx];S.picks[q.id]=k;backup();renderQ()}
function move(d){
  const n=S.idx+d;if(n<0)return;
  if(d>0&&!S.picks[Q[S.idx].id])return;
  if(n>=Q.length){view='done';send();return}
  S.idx=n;backup();renderQ();window.scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('keydown',e=>{
  if(view!=='q'||e.target.tagName==='INPUT')return;
  const q=Q[S.idx],k=e.key.toUpperCase();
  if(q.opts.some(o=>o.k===k))choose(k);else if(e.key==='ArrowRight')move(1);else if(e.key==='ArrowLeft')move(-1);
});
async function send(){
  S.status='sending';backup();render();
  const payload={id:S.id,name:S.name,age:S.age,submittedAt:new Date().toISOString(),
    answers:Q.map(q=>{const k=S.picks[q.id];const o=q.opts.find(x=>x.k===k);return {id:q.id,question:q.title,choice:k||'',label:k==='?'?'Not sure':(o?o.label:'')}})};
  try{
    if(!/^https:\/\//.test(ENDPOINT))throw new Error('no endpoint');
    await fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    S.status='sent';
  }catch(e){S.status='failed'}
  backup();render();
}
function renderDone(){
  const st=S.status;
  app.innerHTML=`<section class="start" style="text-align:center">
   <div style="width:64px;height:64px;border-radius:50%;background:var(--green-soft);color:var(--green);display:grid;place-items:center;margin:0 auto 18px"><svg viewBox="0 0 24 24" style="width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round">${st==='failed'?IC.x:IC.check}</svg></div>
   <h1>${st==='sending'?'Sending…':st==='failed'?'Your answers didn’t send':'Thank you, '+esc(S.name)+'.'}</h1>
   <p>${st==='sending'?'One moment.':st==='failed'?'Check your internet connection and try again. Your answers are kept on this device.':'Your answers have been sent. You can close this page.'}</p>
   ${st==='failed'?'<button class="go" id="retry">Try again</button>':''}
   ${st==='sent'?'<button class="nbtn" id="again" style="margin-top:8px">Start again for someone else</button>':''}</section>`;
  const r=app.querySelector('#retry');if(r)r.onclick=send;
  const a=app.querySelector('#again');if(a)a.onclick=()=>{try{localStorage.removeItem(BK)}catch(e){};S={id:'',name:'',age:'',picks:{},idx:0,status:''};view='start';render()};
}
render();
</script>
</body>
</html>
